name: Build release assets

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify release metadata and source commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-release.mjs "$GITHUB_REF_NAME"

      - name: Set up pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build the plugin
        run: pnpm build

      - name: Verify release assets
        run: |
          node scripts/verify-release.mjs "$GITHUB_REF_NAME" --assets
          git diff --exit-code

      - name: Attest the three release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Download these exact files from this run for manual GitHub Release creation.
      - name: Upload the three release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tab-cleaner-${{ github.ref_name }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 30
